services:
  share:
    build: .
    ports:
      - "127.0.0.1:8191:8191"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8191}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      USER_QUOTA_BYTES: ${USER_QUOTA_BYTES:-5368709120}
    volumes:
      - share-data:/data
    restart: unless-stopped
volumes:
  share-data:
